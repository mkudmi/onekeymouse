name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build DMG
        run: npm exec --yes --package @tauri-apps/cli@2.12.2 -- tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: onekeymouse-macos-dmg
          path: target/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build NSIS installer
        run: npm exec --yes --package @tauri-apps/cli@2.12.2 -- tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: onekeymouse-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
