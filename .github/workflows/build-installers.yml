name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build DMG
        run: cargo tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: onekeymouse-macos-dmg
          path: target/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: onekeymouse-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
