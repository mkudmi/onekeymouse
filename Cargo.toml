[package]
name = "onekeymouse"
version = "0.1.0"
edition = "2024"
description = "Share one keyboard and mouse across macOS and Windows"

[dependencies]
axum = "0.8"
if-addrs = "0.13"
mdns-sd = "0.13"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

