[package]
name = "onekeymouse"
version = "0.2.0"
edition = "2024"
description = "Share one keyboard and mouse across macOS and Windows"

[dependencies]
axum = "0.8"
if-addrs = "0.13"
mdns-sd = "0.13"
tauri = { version = "2", features = [] }
inputs = { version = "0.1.1", features = ["inject", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
hmac = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
[build-dependencies]
tauri-build = { version = "2", features = [] }
